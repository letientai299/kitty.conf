# Route clicked URLs through ~/.local/bin/browse so the Chrome profile follows
# the window's cwd. --cwd=last_reported is what supplies that cwd; kitty does
# not expand ~ in action arguments, but it does expand ${HOME}.
# Keyboard URL hints (ctrl+shift+e) bypass this file entirely - see kitty.conf.
protocol http, https
action launch --type=background --cwd=last_reported ${HOME}/.local/bin/browse ${URL}
