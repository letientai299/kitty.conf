term xterm-kitty

repaint_delay 20
input_delay 6

sync_to_monitor yes

allow_remote_control yes

inactive_text_alpha 0.6

remember_window_size  yes
hide_window_decorations no

cursor_blink_interval     1
cursor_shape    beam
mouse_hide_wait 3.0
focus_follows_mouse yes

scrollback_lines 10000
scrollback_pager_history_size 256
scrollback_pager ${KITTY_REPO_ROOT}/bin/kt pager 'INPUT_LINE_NUMBER' 'CURSOR_LINE' 'CURSOR_COLUMN'

include tabs.conf
window_border_width 1pt
window_drag_tolerance 10

open_url_with default
kitty_mod ctrl+shift

map ctrl+shift+e kitten hints --type url --program "launch --type=background --cwd=last_reported ${HOME}/.local/bin/browse"

map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4

map ctrl+shift+f launch --type=overlay ${KITTY_REPO_ROOT}/bin/kt switch
map alt+5 goto_tab 5
map alt+6 goto_tab 6
map alt+7 goto_tab 7
map alt+8 goto_tab 8
map alt+9 goto_tab 9

map ctrl+shift+t new_tab_with_cwd
map ctrl+shift+enter new_window_with_cwd

map alt+h neighboring_window left
map alt+j neighboring_window down
map alt+k neighboring_window up
map alt+l neighboring_window right

enabled_layouts grid,tall,stack,fat,vertical,horizontal,splits
map ctrl+shift+l>s goto_layout stack
map ctrl+shift+l>t goto_layout tall
map ctrl+shift+l>g goto_layout grid
map ctrl+shift+l>f goto_layout fat
map ctrl+shift+l>v goto_layout vertical
map ctrl+shift+l>h goto_layout horizontal
map ctrl+shift+l>l next_layout
map ctrl+shift+z toggle_maximized

map ctrl+shift+alt+j resize_window taller 10
map ctrl+shift+alt+k resize_window shorter 10
map ctrl+shift+alt+h resize_window narrower 10
map ctrl+shift+alt+l resize_window wider 10

map alt+f1 launch --type=overlay --cwd=current ${KITTY_REPO_ROOT}/bin/kt task
map ctrl+shift+o copy_last_command_output
map alt+f2 detach_window new-tab

include current-theme.conf

disable_ligatures never
font_size        15.0
font_family      family="Iosevka Nerd Font Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
