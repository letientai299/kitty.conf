# vim: set ft=kitty:
# Rendering and memory
repaint_delay 20
input_delay 6
sync_to_monitor yes
cursor_blink_interval 0
scrollback_lines 10000
scrollback_pager_history_size 64

# Portable font defaults
font_family monospace
font_size 15.0

# Window behavior
cursor_shape beam
focus_follows_mouse yes
window_border_width 1pt
window_margin_width 1
window_drag_tolerance 10
enabled_layouts grid,tall,stack,fat,vertical,horizontal,splits

# Tab renderer
tab_bar_edge bottom
tab_bar_min_tabs 1
tab_bar_style custom

# Integration
allow_remote_control yes
scrollback_pager ${KITTY_REPO_ROOT}/bin/kt pager 'INPUT_LINE_NUMBER' 'CURSOR_LINE' 'CURSOR_COLUMN'

# Shared defaults, then local preferences
include colors.conf
include keys.conf
geninclude global.py
globinclude local/machine.conf
globinclude local/theme.conf
globinclude local/preferences.conf
