[tools]
go = "1.27.1"
prek = "0.5.3"
golangci-lint = "2.13.2"
ruff = "0.16.8"
prettier = "3.9.8"
python = "3.14.7"
shellcheck = "0.11.0"
shfmt = "3.14.1"
uv = "0.12.17"
ty = "0.0.83"

[tasks.setup]
description = "Create the Python env and fetch Kitty sources for type checking"
run = [
  "uv sync",
  '''[ -d .venv/kitty-src/.git ] || git clone --quiet --depth 1 --filter=blob:none --sparse --branch "v$(kitty --version | cut -d' ' -f2)" https://github.com/kovidgoyal/kitty .venv/kitty-src''',
  "git -C .venv/kitty-src sparse-checkout set kitty",
]

[tasks.build]
description = "Build Go utilities"
run = "go build -trimpath -o bin/kt ./cmd/kt"

[tasks.install]
description = "Install kt and its zsh completion"
depends = ["build"]
run = [
  'mkdir -p "$HOME/.local/bin" "$HOME/.local/share/zsh/site-functions"',
  'ln -sfn "$PWD/bin/kt" "$HOME/.local/bin/kt"',
  './bin/kt completion zsh > "$HOME/.local/share/zsh/site-functions/_kt"',
]

[tasks.launch]
description = "Launch an isolated Kitty instance"
depends = ["build"]
run = "./bin/kt"

[tasks."qt:register"]
description = "Bind Cmd+Esc to this checkout's quick terminal"
depends = ["build"]
run = "python scripts/qt-hotkey.py register"

[tasks."qt:unregister"]
description = "Remove this checkout's quick terminal shortcut"
run = "python scripts/qt-hotkey.py unregister"

[tasks.fmt]
description = "Format source and documentation"
run = ["gofmt -w cmd internal", "ruff check --fix .", "ruff format .", "shfmt -w scripts/open-url", "prettier --write '**/*.md' '*.yaml'"]

[tasks.lint]
description = "Check source and formatting"
run = ["golangci-lint run", "ruff check .", "ruff format --check .", "ty check", "shellcheck scripts/open-url", "shfmt -d scripts/open-url", "prettier --check '**/*.md' '*.yaml'"]

[tasks.test]
depends = ["build"]
description = "Test utilities and Python integration"
run = ["go test -race ./...", "python -m unittest discover -s tests"]

[tasks.bench]
description = "Benchmark switcher row construction"
run = "go test ./internal/kitty -run '^$' -bench BenchmarkRows -benchmem"

[tasks.check]
description = "Build, lint, and test"
depends = ["build", "lint", "test"]

[tasks.hooks]
description = "Install repository hooks"
run = "prek install"
